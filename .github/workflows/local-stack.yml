name: Local Stack Validation

on:
  pull_request:
    paths:
      - "deploy/local/**"
      - ".github/workflows/local-stack.yml"
  push:
    branches: [main]
    paths:
      - "deploy/local/**"
      - ".github/workflows/local-stack.yml"

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: packaging
      - name: Validate compose model
        run: docker compose -f packaging/deploy/local/docker-compose.yml config
      - name: Validate smoke checker
        run: python -m py_compile packaging/deploy/local/smoke.py
      - name: Cross-repository build note
        run: echo 'Application image builds require an organization-scoped read token; repository-local CI validates each service image independently.'
      # Cross-repository checkouts are intentionally omitted because GITHUB_TOKEN is repository-scoped.
      #       - uses: actions/checkout@v4
      #         with:
      #           repository: AimecLabs/aimec-intelligence-platform
          path: services/platform
